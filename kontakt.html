<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontakt oss — Substans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site">
  <div class="wrap nav">
    <a class="word" href="index.html">Substans<span>.</span></a>
    <div class="nav-links">
      <a class="switch" href="index.html">Forside</a>
      <a class="switch" href="for-bedrifter.html">For bedrifter</a>
      <a class="switch" href="for-kandidater.html">For kandidater</a>
      <a class="switch current" href="kontakt.html">Kontakt oss</a>
      <a class="cta" href="kontakt.html">Ta kontakt</a>
    </div>
  </div>
</header>

<section class="hero" style="padding-bottom:40px;">
  <div class="wrap">
    <span class="mono">Kontakt</span>
    <h1 class="display">Ta kontakt.</h1>
    <p class="lead">Enten du representerer en bedrift, er selger og nysgjerrig på muligheter, eller bare har et spørsmål — send oss en melding.</p>
  </div>
</section>

<div class="rule"></div>

<section>
  <div class="wrap">
    <div class="contact-box">
      <h2 class="display">Skriv til oss.</h2>
      <p>Fyll ut skjemaet, så svarer vi deg.</p>
      <form name="kontakt-generell" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="kontakt-generell" />
        <p class="hp-field"><label>Ikke fyll ut dette feltet: <input name="bot-field" /></label></p>
        <div class="form-field">
          <label for="navn-g">Navn</label>
          <input type="text" id="navn-g" name="navn" required>
        </div>
        <div class="form-field">
          <label for="epost-g">E-post</label>
          <input type="email" id="epost-g" name="epost" required>
        </div>
        <div class="form-field">
          <label for="melding-g">Melding</label>
          <textarea id="melding-g" name="melding" required></textarea>
        </div>
        <button type="submit" class="form-submit">Send</button>
      </form>
    </div>
  </div>
</section>

<footer class="site wrap">
  <span>Substans — Oslo</span>
  <span>© 2026</span>
</footer>

</body>
</html>
